<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chai Corner Menu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Welcome to Chai Corner</h1>
    <!-- Navigation Bar -->
    <nav class="navbar">
      <a href="index.html" class="active">Home</a>
      <a href="gallery.html">Gallery</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <!-- Featured Image -->
    <section class="image-container">
      <img src="images/chai.jpg" alt="Karak Chai" class="hero-image">
    </section>

    <!-- Menu Table -->
    <section class="table-container">
      <h2>Our Special Menu</h2>
      <table>
        <thead>
          <tr>
            <th>Item</th>
            <th>Category</th>
            <th>Price (PKR)</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Karak Chai</td>
            <td>Beverages</td>
            <td>100</td>
          </tr>
          <tr>
            <td>Cardamom Chai</td>
            <td>Beverages</td>
            <td>120</td>
          </tr>
          <tr>
            <td>Samosa (2 pcs)</td>
            <td>Snacks</td>
            <td>150</td>
          </tr>
        </tbody>
      </table>
    </section>

    <!-- Interactive Button -->
    <section class="action-container">
      <button class="btn-order" onclick="placeOrder()">Order Chai</button>
    </section>
  </main>

  <script>
    function placeOrder() {
      console.log("Order button was clicked for Karak Chai.");
      window.alert("Your Karak Chai order has been placed successfully!");
    }
  </script>

</body>
</html>
